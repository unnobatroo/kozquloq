[project]
name = "kozquloq"
version = "0.1.0"
description = "Autonomous vehicle sensor data quality & diagnostics pipeline (nuScenes)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "torch>=2.2",
    "torchvision>=0.17",
    "nuscenes-devkit>=1.1.11",
    "shapely>=2.0",
    "pyarrow>=14,<19",
]

[project.scripts]
kozquloq = "kozquloq.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/.pre-commit-config.yaml",
    "/.coderabbit.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kozquloq"]

[tool.hatch.build.targets.wheel.force-include]
"src/kozquloq/storage/schema.sql" = "kozquloq/storage/schema.sql"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]  # line length enforced by the formatter, not the linter

[tool.ruff.lint.isort]
known-first-party = ["kozquloq"]

[tool.ruff.lint.per-file-ignores]
# SE(3) transform names (T_a_to_b, R, K) are domain convention — keep them.
"src/kozquloq/types.py" = ["N815", "N816"]
"src/kozquloq/auditors/geometry.py" = ["N803", "N806"]
"src/kozquloq/synthetic.py" = ["N803", "N806"]
"src/kozquloq/ingestion.py" = ["N806"]
"tests/**" = ["N803", "N806", "N815"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["kozquloq"]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["nuscenes.*", "pyquaternion.*", "cv2.*", "duckdb.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:shapely.*",
    "ignore::DeprecationWarning:nuscenes.*",
    "error",
]

[tool.coverage.run]
branch = true
source = ["src/kozquloq"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = ["tests"]
